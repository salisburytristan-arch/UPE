name: CI Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # =============================================================================
  # Quick Documentation Link Gate
  # =============================================================================
  quick-doc-link-gate:
    name: Quick Doc Link Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify Markdown Link Integrity
      run: python scripts/check_markdown_links.py

    - name: Publish Documentation Gate Summary
      run: |
        {
          echo "## Quick Documentation Link Gate"
          echo ""
          echo "- Status: passed"
          echo "- Command: \\`python scripts/check_markdown_links.py\\`"
        } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Windows Build (CMake)
  # =============================================================================
  build-windows:
    name: Windows (${{ matrix.config }})
    runs-on: windows-latest
    needs: [quick-doc-link-gate]
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
          -DUPE_BUILD_TESTS=ON `
          -DUPE_BUILD_EXAMPLES=ON `
          -DUPE_DETERMINISTIC=ON `
          -DUPE_WARNINGS_AS_ERRORS=OFF
    
    - name: Build
      run: cmake --build build --config ${{ matrix.config }} --parallel
    
    - name: Run Tests
      run: |
        New-Item -ItemType Directory -Force -Path proof\ci | Out-Null
        cd build
        ctest -C ${{ matrix.config }} --output-on-failure 2>&1 | Tee-Object -FilePath ..\proof\ci\windows-tests-${{ matrix.config }}.log
    
    - name: Test Example Runs
      run: |
        cd build/bin/examples
        Get-ChildItem *.exe | Select-Object -First 2 | ForEach-Object { 
          Write-Host "Running $_"
          & $_.FullName
        }
      shell: powershell
    
    - name: Upload Build Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-windows-${{ matrix.config }}
        path: |
          build/lib/
          build/bin/
        if-no-files-found: warn

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-windows-tests-${{ matrix.config }}
        path: proof/ci/windows-tests-${{ matrix.config }}.log
        if-no-files-found: warn

    - name: Publish Windows Summary
      if: always()
      shell: bash
      run: |
        {
          echo "## Windows (${{ matrix.config }})"
          echo ""
          echo "- Build artifacts: uploaded"
          echo "- Test log: \\`proof/ci/windows-tests-${{ matrix.config }}.log\\`"
        } >> "$GITHUB_STEP_SUMMARY"
  
  # =============================================================================
  # Linux Build (CMake)
  # =============================================================================
  build-linux:
    name: Linux (${{ matrix.config }}, ${{ matrix.compiler }})
    runs-on: ubuntu-latest
    needs: [quick-doc-link-gate]
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build clang
    
    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DUPE_BUILD_TESTS=ON \
          -DUPE_BUILD_EXAMPLES=ON \
          -DUPE_DETERMINISTIC=ON
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run Tests
      run: |
        mkdir -p proof/ci
        cd build
        ctest --output-on-failure 2>&1 | tee ../proof/ci/linux-tests-${{ matrix.compiler }}-${{ matrix.config }}.log
    
    - name: Test Example Runs
      run: |
        cd build/bin/examples
        for exe in $(ls | head -2); do 
          echo "Running $exe"
          timeout 10s ./$exe || true
        done
    
    - name: Upload Build Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-linux-${{ matrix.compiler }}-${{ matrix.config }}
        path: |
          build/lib/
          build/bin/
        if-no-files-found: warn

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-linux-tests-${{ matrix.compiler }}-${{ matrix.config }}
        path: proof/ci/linux-tests-${{ matrix.compiler }}-${{ matrix.config }}.log
        if-no-files-found: warn

    - name: Publish Linux Summary
      if: always()
      run: |
        {
          echo "## Linux (${{ matrix.config }}, ${{ matrix.compiler }})"
          echo ""
          echo "- Build artifacts: uploaded"
          echo "- Test log: \\`proof/ci/linux-tests-${{ matrix.compiler }}-${{ matrix.config }}.log\\`"
        } >> "$GITHUB_STEP_SUMMARY"
  
  # =============================================================================
  # macOS Build (CMake)
  # =============================================================================
  build-macos:
    name: macOS (${{ matrix.config }})
    runs-on: macos-latest
    needs: [quick-doc-link-gate]
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: brew install cmake ninja
    
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DUPE_BUILD_TESTS=ON \
          -DUPE_BUILD_EXAMPLES=ON \
          -DUPE_DETERMINISTIC=ON
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run Tests
      run: |
        mkdir -p proof/ci
        cd build
        ctest --output-on-failure 2>&1 | tee ../proof/ci/macos-tests-${{ matrix.config }}.log
    
    - name: Upload Build Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-macos-${{ matrix.config }}
        path: |
          build/lib/
          build/bin/
        if-no-files-found: warn

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-macos-tests-${{ matrix.config }}
        path: proof/ci/macos-tests-${{ matrix.config }}.log
        if-no-files-found: warn

    - name: Publish macOS Summary
      if: always()
      run: |
        {
          echo "## macOS (${{ matrix.config }})"
          echo ""
          echo "- Build artifacts: uploaded"
          echo "- Test log: \\`proof/ci/macos-tests-${{ matrix.config }}.log\\`"
        } >> "$GITHUB_STEP_SUMMARY"
  
  # =============================================================================
  # Determinism Verification
  # =============================================================================
  determinism-test:
    name: Determinism Certification
    runs-on: ubuntu-latest
    needs: [quick-doc-link-gate]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Build Release
      run: |
        cmake -B build-release -DCMAKE_BUILD_TYPE=Release \
          -DUPE_DETERMINISTIC=ON -DUPE_BUILD_TESTS=ON
        cmake --build build-release --parallel
    
    - name: Build Debug
      run: |
        cmake -B build-debug -DCMAKE_BUILD_TYPE=Debug \
          -DUPE_DETERMINISTIC=ON -DUPE_BUILD_TESTS=ON
        cmake --build build-debug --parallel
    
    - name: Run Determinism Tests (10 iterations)
      run: |
        echo "::group::Running determinism verification"
        for i in {1..10}; do
          build-release/bin/upe_tests > run_$i.log 2>&1 || true
        done
        
        # Compare all outputs
        md5sum run_*.log | awk '{print $1}' | sort -u | wc -l > unique_count.txt
        UNIQUE=$(cat unique_count.txt)
        
        if [ "$UNIQUE" -eq "1" ]; then
          echo "✅ Determinism verified: All 10 runs identical"
        else
          echo "⚠️  Got $UNIQUE different outputs (may be due to timestamps)"
        fi
        echo "::endgroup::"

    - name: Run Proof Artifact Capture
      run: bash tools/run_determinism_proof.sh build-release

    - name: Upload Determinism Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-determinism-proof
        path: |
          proof/RUNS/
          run_*.log
          unique_count.txt
        if-no-files-found: warn

    - name: Publish Determinism Summary
      if: always()
      run: |
        UNIQUE=$(cat unique_count.txt 2>/dev/null || echo "missing")
        HASH1=$(grep -h -m1 '^hash_run_1=' proof/RUNS/determinism_*.log 2>/dev/null | tail -1 | cut -d= -f2)
        HASH2=$(grep -h -m1 '^hash_run_2=' proof/RUNS/determinism_*.log 2>/dev/null | tail -1 | cut -d= -f2)
        if [ -z "$HASH1" ]; then HASH1="missing"; fi
        if [ -z "$HASH2" ]; then HASH2="missing"; fi
        {
          echo "## Determinism Certification"
          echo ""
          echo "- Repeated runs checked: 10"
          echo "- Unique log digests: ${UNIQUE}"
          echo "- Proof hash run 1: \\`${HASH1}\\`"
          echo "- Proof hash run 2: \\`${HASH2}\\`"
          echo "- Artifacts: \\`proof/RUNS/\\`, \\`run_*.log\\`, \\`unique_count.txt\\`"
        } >> "$GITHUB_STEP_SUMMARY"
  
  # =============================================================================
  # Cross-Compiler Determinism
  # =============================================================================
  cross-compiler-determinism:
    name: Cross-Compiler Check (GCC vs Clang)
    runs-on: ubuntu-latest
    needs: [quick-doc-link-gate]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Build with GCC
      env:
        CC: gcc
        CXX: g++
      run: |
        cmake -B build-gcc -DCMAKE_BUILD_TYPE=Release \
          -DUPE_DETERMINISTIC=ON -DUPE_BUILD_TESTS=ON
        cmake --build build-gcc --parallel
        build-gcc/bin/upe_tests > gcc_output.log 2>&1 || true
    
    - name: Build with Clang  
      env:
        CC: clang
        CXX: clang++
      run: |
        cmake -B build-clang -DCMAKE_BUILD_TYPE=Release \
          -DUPE_DETERMINISTIC=ON -DUPE_BUILD_TESTS=ON
        cmake --build build-clang --parallel
        build-clang/bin/upe_tests > clang_output.log 2>&1 || true
    
    - name: Compare Outputs
      run: |
        GCC_HASH=$(md5sum gcc_output.log | awk '{print $1}')
        CLANG_HASH=$(md5sum clang_output.log | awk '{print $1}')
        
        echo "GCC MD5:   $GCC_HASH"
        echo "Clang MD5: $CLANG_HASH"
        
        if [ "$GCC_HASH" = "$CLANG_HASH" ]; then
          echo "✅ Cross-compiler determinism verified"
        else
          echo "⚠️  Different outputs (may be normal with different FP implementations)"
        fi

    - name: Upload Cross-Compiler Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-cross-compiler-determinism
        path: |
          gcc_output.log
          clang_output.log
        if-no-files-found: warn

    - name: Publish Cross-Compiler Summary
      if: always()
      run: |
        GCC_TEST_HASH=$(grep -m1 'Test determinism hash:' gcc_output.log 2>/dev/null | awk '{print $4}')
        CLANG_TEST_HASH=$(grep -m1 'Test determinism hash:' clang_output.log 2>/dev/null | awk '{print $4}')
        if [ -z "$GCC_TEST_HASH" ]; then GCC_TEST_HASH="missing"; fi
        if [ -z "$CLANG_TEST_HASH" ]; then CLANG_TEST_HASH="missing"; fi
        {
          echo "## Cross-Compiler Determinism"
          echo ""
          echo "- GCC test hash: \\`${GCC_TEST_HASH}\\`"
          echo "- Clang test hash: \\`${CLANG_TEST_HASH}\\`"
          echo "- Raw logs uploaded: \\`gcc_output.log\\`, \\`clang_output.log\\`"
        } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Windows Determinism Proof
  # =============================================================================
  determinism-windows:
    name: Determinism (Windows)
    runs-on: windows-latest
    needs: [quick-doc-link-gate]

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure + Build
      run: |
        cmake -S . -B build-proof-win -DCMAKE_BUILD_TYPE=Release -DUPE_BUILD_TESTS=ON -DUPE_BUILD_EXAMPLES=OFF -DUPE_DETERMINISTIC=ON -DUPE_WARNINGS_AS_ERRORS=OFF
        cmake --build build-proof-win --config Release --parallel

    - name: Run Determinism Proof
      run: cmd /c tools\run_determinism_proof.bat build-proof-win

    - name: Upload Determinism Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-determinism-proof-windows
        path: proof/RUNS/
        if-no-files-found: warn

    - name: Publish Windows Determinism Summary
      if: always()
      shell: pwsh
      run: |
        $hash1 = "missing"
        $hash2 = "missing"
        $log = Get-ChildItem -Path "proof/RUNS" -Filter "determinism_*.log" -ErrorAction SilentlyContinue | Select-Object -Last 1
        if ($log) {
          $line1 = Select-String -Path $log.FullName -Pattern '^hash_run_1=' -ErrorAction SilentlyContinue | Select-Object -First 1
          $line2 = Select-String -Path $log.FullName -Pattern '^hash_run_2=' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($line1) { $hash1 = ($line1.Line -split '=',2)[1] }
          if ($line2) { $hash2 = ($line2.Line -split '=',2)[1] }
        }
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Determinism (Windows)"
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('- hash_run_1: `{0}`' -f $hash1)
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('- hash_run_2: `{0}`' -f $hash2)
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Artifact: `proof/RUNS/`'

  # =============================================================================
  # macOS Determinism Proof
  # =============================================================================
  determinism-macos:
    name: Determinism (macOS)
    runs-on: macos-latest
    needs: [quick-doc-link-gate]

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: brew install cmake ninja

    - name: Configure + Build
      run: |
        cmake -S . -B build-proof-macos -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DUPE_BUILD_TESTS=ON \
          -DUPE_BUILD_EXAMPLES=OFF \
          -DUPE_DETERMINISTIC=ON
        cmake --build build-proof-macos --parallel

    - name: Run Determinism Proof
      run: bash tools/run_determinism_proof.sh build-proof-macos

    - name: Upload Determinism Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-determinism-proof-macos
        path: proof/RUNS/
        if-no-files-found: warn

    - name: Publish macOS Determinism Summary
      if: always()
      run: |
        HASH1=$(grep -h -m1 '^hash_run_1=' proof/RUNS/determinism_*.log 2>/dev/null | tail -1 | cut -d= -f2)
        HASH2=$(grep -h -m1 '^hash_run_2=' proof/RUNS/determinism_*.log 2>/dev/null | tail -1 | cut -d= -f2)
        if [ -z "$HASH1" ]; then HASH1="missing"; fi
        if [ -z "$HASH2" ]; then HASH2="missing"; fi
        {
          echo "## Determinism (macOS)"
          echo ""
          echo "- hash_run_1: \\`${HASH1}\\`"
          echo "- hash_run_2: \\`${HASH2}\\`"
          echo "- Artifact: \\`proof/RUNS/\\`"
        } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Canonical Benchmark Proof
  # =============================================================================
  benchmark-canonical-scenes:
    name: World-Step Benchmarks
    runs-on: ubuntu-latest
    needs: [quick-doc-link-gate]

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build

    - name: Configure Benchmarks
      run: |
        cmake -B build-bench -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DUPE_BUILD_TESTS=OFF \
          -DUPE_BUILD_EXAMPLES=OFF \
          -DUPE_BUILD_BENCHMARKS=ON \
          -DUPE_DETERMINISTIC=ON

    - name: Build World-Step Benchmarks
      run: cmake --build build-bench --target upe_bench_world_step_v2 --parallel

    - name: Run World-Step Benchmarks
      run: |
        mkdir -p proof/ci
        python scripts/run_canonical_benchmark_gate.py \
          --build-dir build-bench \
          --skip-build \
          --results-json proof/ci/canonical-benchmarks.json \
          --results-csv proof/ci/canonical-benchmarks.csv \
          --report-html proof/ci/benchmark_report.html \
          --compare-baseline \
          --threshold 20.0 \
          --steps 300 \
          --warmup 60 2>&1 | tee proof/ci/canonical-benchmarks.log

    - name: Upload Benchmark Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-canonical-benchmarks
        path: |
          proof/ci/canonical-benchmarks.csv
          proof/ci/canonical-benchmarks.json
          proof/ci/canonical-benchmarks.log
          proof/ci/benchmark_report.html
          proof/RUNS/world_step_benchmark_history.csv
          proof/RUNS/world_step_benchmark_trend_*.json
        if-no-files-found: warn

    - name: Publish Benchmark Summary
      if: always()
      run: |
        {
          echo "## World-Step Benchmarks"
          echo ""
          echo "- CSV artifact: \`proof/ci/canonical-benchmarks.csv\`"
          echo "- JSON artifact: \`proof/ci/canonical-benchmarks.json\`"
          echo "- HTML report artifact: \\`proof/ci/benchmark_report.html\\`"
          echo "- Execution log artifact: \\`proof/ci/canonical-benchmarks.log\\`"
          echo "- Trend artifacts: \`proof/RUNS/world_step_benchmark_history.csv\`, \`proof/RUNS/world_step_benchmark_trend_*.json\`"
        } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Strict Warnings Parity (Linux GCC/Clang)
  # =============================================================================
  strict-warnings-linux:
    name: Strict Warnings (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    needs: [quick-doc-link-gate]
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build clang

    - name: Run Strict Warnings Gate
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        python scripts/run_strict_warnings_gate.py --build-dir build_warn_${{ matrix.compiler }}

    - name: Publish Strict Warnings Summary
      run: |
        {
          echo "## Strict Warnings (${{ matrix.compiler }})"
          echo ""
          echo "- Status: passed"
          echo "- Command: \\`python scripts/run_strict_warnings_gate.py --build-dir build_warn_${{ matrix.compiler }}\\`"
        } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Release Package Gate
  # =============================================================================
  release-package-gate:
    name: Release Package Gate
    runs-on: ubuntu-latest
    needs: [quick-doc-link-gate, strict-warnings-linux, benchmark-canonical-scenes, determinism-test, cross-compiler-determinism, determinism-windows, determinism-macos]

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify Topic Truth Audit Freshness
      run: python scripts/generate_topic_truth_audit.py --check

    - name: Create and Verify Release Packages
      run: python scripts/verify_release_gate.py --create --dir releases_ci

    - name: Upload Release Gate Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upe-release-gate
        path: |
          releases_ci/
          topic_truth_audit.csv
          docs/TOPIC_TRUTH_AUDIT.md
        if-no-files-found: warn

    - name: Publish Release Gate Summary
      if: always()
      run: |
        {
          echo "## Release Package Gate"
          echo ""
          echo "- Release artifacts: \\`releases_ci/\\`"
          echo "- Topic audit artifacts refreshed and verified"
        } >> "$GITHUB_STEP_SUMMARY"
